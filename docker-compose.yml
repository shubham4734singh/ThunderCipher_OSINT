version: '3.8'

services:
  web:
    image: python:3.9-slim
    command: python app.py
    ports:
      - "8000:8000"
    environment:
      - ENV=prod
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      
  db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=thunder
      - POSTGRES_PASSWORD=thunder_pass
      - POSTGRES_DB=thunder_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
